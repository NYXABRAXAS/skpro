<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" role="img" aria-label="Suryoday Small Finance Bank – A Bank of Smiles">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9A03F"/>
      <stop offset="1" stop-color="#F26522"/>
    </linearGradient>
  </defs>

  <!-- Rising sun mark -->
  <g transform="translate(6,4)">
    <circle cx="40" cy="46" r="19" fill="url(#sun)"/>
    <g fill="url(#sun)">
      <polygon points="40,2 47,17 33,17"/>
      <polygon points="14,12 27,20 18,29"/>
      <polygon points="66,12 62,29 53,20"/>
      <polygon points="6,40 20,37 20,49"/>
      <polygon points="74,40 60,37 60,49"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="92" y="50" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" letter-spacing="1.5" fill="#2E3192">SURYODAY</text>
  <text x="94" y="74" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="12.5" font-weight="700" letter-spacing="3.4" fill="#F58220">A BANK OF SMILES</text>
</svg>
