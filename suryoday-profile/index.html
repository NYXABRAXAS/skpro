<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Profile &middot; Suryoday Small Finance Bank</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<!--
  100% OFFLINE — no CDN, no web fonts, no network calls.

  data-view : "auto" (default) | "mobile" | "web"        (see README)
  data-logo : add this attribute to show the Suryoday logo in the banner

  Fill the values below directly, OR set window.SURYODAY_PROFILE before app.js.
-->
<body class="pf-body" data-view="auto">

  <main class="pf-shell">
    <section class="pf-card" aria-label="Customer profile">

      <header class="pf-banner">
        <img class="pf-banner__logo" src="assets/suryoday-logo.png" alt="Suryoday Small Finance Bank" />
        <div class="pf-avatar" id="pfAvatar">
          <svg class="pf-avatar__icon" viewBox="0 0 96 96" role="img" aria-label="Profile">
            <circle cx="48" cy="48" r="48" fill="#e8eef7"/>
            <circle cx="48" cy="39" r="15" fill="#1b3a8b"/>
            <path d="M20 80c3-15 14-22 28-22s25 7 28 22z" fill="#1b3a8b"/>
          </svg>
        </div>
      </header>

      <h1 class="pf-name" id="pfName">Lokesh Morbal</h1>

      <dl class="pf-fields">
        <div class="pf-row">
          <span class="pf-row__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2.5"/>
              <circle cx="8.5" cy="11" r="2"/>
              <path d="M6 15.5c.5-1.3 1.4-2 2.5-2s2 .7 2.5 2M14 10h4.5M14 13.5h4.5"/>
            </svg>
          </span>
          <dt>Aadhaar Ref No.</dt>
          <dd id="pfAadhaarRefNo">1234 5678 9123</dd>
        </div>

        <div class="pf-row">
          <span class="pf-row__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 9h14M5 15h14M10.5 4 8.5 20M15.5 4l-2 16"/>
            </svg>
          </span>
          <dt>CIF No.</dt>
          <dd id="pfCifNo">100 200 300 400</dd>
        </div>

        <div class="pf-row">
          <span class="pf-row__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"/>
              <path d="M13.5 3v5.5H19M8.5 13h7M8.5 16.5h7"/>
            </svg>
          </span>
          <dt>PAN No.</dt>
          <dd id="pfPanNo">ABCDE1234F</dd>
        </div>
      </dl>

    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
